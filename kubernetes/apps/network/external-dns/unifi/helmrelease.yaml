---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-unifi
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.10.15@sha256:c469c3ad5098652b0c620f2c66dac68427124641193ea6698fb17fad74caee37
        env:
          - name: UNIFI_HOST
            value: https://unifi.internal
          - name: &name UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: &secret external-dns-unifi-secret
                key: *name
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
    # TODO: restore `sync` once the 0.10.x Integration API provider is confirmed
    # to be reconciling records correctly; upsert-only cannot prune.
    policy: upsert-only
    # No `crd` source: both DNSEndpoints (cloudflared tunnel CNAME, minecraft
    # WAN A record) are public-only. UniFi rejects the tunnel CNAME, which
    # failed every batch and froze all LAN records.
    sources: ["gateway-httproute", "service"]
    txtOwnerId: k8s
    txtPrefix: k8s.
    domainFilters:
      - ${SECRET_DOMAIN}
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
