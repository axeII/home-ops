---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-probe
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      gpu-probe:
        type: cronjob
        cronjob:
          schedule: "*/15 * * * *"
          concurrencyPolicy: Forbid
          backoffLimit: 0
          successfulJobsHistory: 1
          failedJobsHistory: 2
          ttlSecondsAfterFinished: 3600
        pod:
          restartPolicy: Never
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/ffmpeg
              tag: 9.0.2-cli-ls89@sha256:822d04f0b2d0c4847430f5cc90f20ea48be866bb502ece63fdeb729400bf5361
            command:
              - /bin/bash
              - -c
            # A wedged i915 fails every VA-API encode with EIO, so a 3 s
            # low-power H.264 encode is the same path Plex uses to transcode.
            args:
              - |
                set -u
                start=$(date +%s)
                dev=$(ls /dev/dri/renderD* 2>/dev/null | head -n1)
                if [ -z "$dev" ]; then
                  ok=false
                  msg="no render node in /dev/dri"
                else
                  out=$(timeout 60 ffmpeg -hide_banner -nostats -loglevel error \
                    -init_hw_device vaapi=va:"$dev" -filter_hw_device va \
                    -f lavfi -i testsrc2=size=1280x720:rate=30 -t 3 \
                    -vf 'format=nv12,hwupload' -c:v h264_vaapi -low_power 1 \
                    -f null - 2>&1)
                  rc=$?
                  if [ "$rc" -eq 0 ]; then
                    ok=true
                    msg=""
                  else
                    ok=false
                    msg="ffmpeg exit $rc: $(printf '%s' "$out" | tail -c 200)"
                  fi
                fi
                echo "success=$ok $msg"
                curl -fsS -m 10 -X POST -G \
                  -H "Authorization: Bearer $GATUS_GPU_PROBE_TOKEN" \
                  --data-urlencode "success=$ok" \
                  --data-urlencode "error=$msg" \
                  --data-urlencode "duration=$(( $(date +%s) - start ))s" \
                  http://gatus.observability.svc.cluster.local/api/v1/endpoints/infra_arc-gpu/external
            env:
              LIBVA_DRIVER_NAME: iHD
              GATUS_GPU_PROBE_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: gatus-gpu-probe-secret
                    key: GATUS_GPU_PROBE_TOKEN
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 512Mi
                gpu.intel.com/i915: 1
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups:
          - 44
