---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: grafanacloud-prometheus
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: Prometheus
    type: prometheus
    access: proxy
    url: http://metrics.internal
    isDefault: true
    jsonData:
      # Alloy scrapes every 60s. Without this Grafana assumes 15s, so
      # $__rate_interval drops to 1m on short ranges, where a single sample
      # leaves rate() empty and the "live" panels go blank.
      timeInterval: 60s
