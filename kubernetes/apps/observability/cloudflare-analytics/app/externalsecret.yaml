---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-analytics
spec:
  refreshInterval: 4h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cloudflare-analytics-secret
    template:
      data:
        # Read-only token, separate from the DNS-edit token external-dns uses.
        # Scopes: Zone Analytics:Read, Firewall Services:Read,
        # Account Analytics:Read, Account Settings:Read.
        CF_API_TOKEN: "{{ .CLOUDFLARE_ANALYTICS_API_TOKEN }}"
  dataFrom:
    - extract:
        key: cloudflare
