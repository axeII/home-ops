---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./grafanadatasource.yaml
configMapGenerator:
  - name: grafana-dashboard-cloudflare-zone
    files:
      - cloudflare-zone.json=./dashboards/cloudflare-zone.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # The dashboard JSON is full of ${...} Grafana variables.
    kustomize.toolkit.fluxcd.io/substitute: disabled
