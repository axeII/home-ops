---
# One ICMP echo per second to each host. The `hop` label orders the targets
# along the path out of the house, so loss can be pinned to a segment:
#   lan       UniFi gateway; loss here is inside the house
#   modem     Vodafone CH7465VF in bridge mode; its chip deprioritises ICMP
#             to itself, so treat loss here as noise unless later hops agree
#   isp-edge  first Vodafone router that answers (traceroute hop 3; the CMTS
#             at hop 2 does not reply); loss starting here is the coax segment
#   cz        CZ.NIC ODVR resolver, a Czech destination outside Vodafone
#   internet  anycast resolvers, the whole path
# protocol: udp uses unprivileged ICMP sockets (still ICMP echo on the wire),
# which needs net.ipv4.ping_group_range on the pod instead of CAP_NET_RAW.
targets:
  - hosts: ["192.168.69.1"]
    network: ip4
    protocol: udp
    labels:
      hop: lan
  - hosts: ["192.168.100.1"]
    network: ip4
    protocol: udp
    labels:
      hop: modem
  - hosts: ["86.49.1.113"]
    network: ip4
    protocol: udp
    labels:
      hop: isp-edge
  - hosts: ["193.17.47.1"]
    network: ip4
    protocol: udp
    labels:
      hop: cz
  - hosts: ["1.1.1.1", "8.8.8.8"]
    network: ip4
    protocol: udp
    labels:
      hop: internet
