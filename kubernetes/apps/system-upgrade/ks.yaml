---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tuppr
  namespace: &namespace system-upgrade
spec:
  dependsOn:
    - name: external-secrets-stores
      namespace: kube-system
  # ./app contains ceph-secrets.sops.yaml. Without this block Flux applies the
  # file verbatim and the Secret ends up holding raw ENC[AES256_GCM,...]
  # ciphertext, which is what the tuppr ceph hooks were mounting as their
  # keyring and mon_host.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./kubernetes/apps/system-upgrade/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr-cr
  namespace: system-upgrade
spec:
  dependsOn:
    - name: tuppr
      namespace: system-upgrade
  path: ./kubernetes/apps/system-upgrade/cr
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: system-upgrade
  interval: 30m
  retryInterval: 1m
  timeout: 5m
