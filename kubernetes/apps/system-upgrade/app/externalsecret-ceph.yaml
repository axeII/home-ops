---
# Mirrors the Ceph credentials the TalosUpgrade hooks need, straight from the
# rook-ceph namespace. Replaces ceph-secrets.sops.yaml, which held a
# hand-copied client.admin key that had gone stale and matched no cephx entity.
#
# ceph-key comes from the Secret Rook generates for the CephClient "tuppr", so
# if Rook ever rotates that user the mirror follows automatically.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuppr-ceph
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes-rook-ceph
  target:
    name: tuppr-ceph
    creationPolicy: Owner
  data:
    # userKey rather than the "tuppr" key: both hold the same value, but
    # userKey does not change name if the CephClient is ever renamed.
    - secretKey: ceph-key
      remoteRef:
        key: rook-ceph-client-tuppr
        property: userKey
    - secretKey: mon_host
      remoteRef:
        key: rook-ceph-config
        property: mon_host
