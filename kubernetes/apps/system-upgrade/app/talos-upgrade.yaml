---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.9
  policy:
    debug: false
    force: false
    rebootMode: default
    placement: hard
    timeout: 30m
    stage: false
  parallelism: 1
  maintenance:
    windows:
      - start: "0 2 * * 0"
        duration: "4h"
        timezone: "Europe/Paris"
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
      expr: status.ceph.health in ["HEALTH_OK"]
  hooks:
    pre:
      - name: ceph-set-noout
        image: docker.io/rook/ceph:v1.20.7
        command:
          - sh
          - -c
        args:
          - >-
            printf '[global]\n\tmon_host = %s\n' "$MON_HOST" > /tmp/ceph.conf
            &&
            printf '[client.tuppr]\n\tkey = %s\n' "$CEPH_KEY" > /tmp/keyring
            &&
            ceph -c /tmp/ceph.conf --keyring /tmp/keyring -n client.tuppr
            osd set noout
        env:
          # Both values are mirrored live out of the rook-ceph namespace by the
          # tuppr-ceph ExternalSecret, so they cannot go stale.
          - name: CEPH_KEY
            valueFrom:
              secretKeyRef:
                name: tuppr-ceph
                key: ceph-key
          - name: MON_HOST
            valueFrom:
              secretKeyRef:
                name: tuppr-ceph
                key: mon_host
        volumeMounts:
          # tuppr builds hook pods with readOnlyRootFilesystem: true, so the
          # redirects above need a writable /tmp. fsGroup 65532 on the hook pod
          # makes this emptyDir writable by the hook's uid.
          - name: tmp
            mountPath: /tmp
        volumes:
          - name: tmp
            emptyDir: {}
    post:
      - name: ceph-unset-noout
        image: docker.io/rook/ceph:v1.20.7
        command:
          - sh
          - -c
        args:
          - >-
            printf '[global]\n\tmon_host = %s\n' "$MON_HOST" > /tmp/ceph.conf
            &&
            printf '[client.tuppr]\n\tkey = %s\n' "$CEPH_KEY" > /tmp/keyring
            &&
            ceph -c /tmp/ceph.conf --keyring /tmp/keyring -n client.tuppr
            osd unset noout
        env:
          # Both values are mirrored live out of the rook-ceph namespace by the
          # tuppr-ceph ExternalSecret, so they cannot go stale.
          - name: CEPH_KEY
            valueFrom:
              secretKeyRef:
                name: tuppr-ceph
                key: ceph-key
          - name: MON_HOST
            valueFrom:
              secretKeyRef:
                name: tuppr-ceph
                key: mon_host
        volumeMounts:
          # tuppr builds hook pods with readOnlyRootFilesystem: true, so the
          # redirects above need a writable /tmp. fsGroup 65532 on the hook pod
          # makes this emptyDir writable by the hook's uid.
          - name: tmp
            mountPath: /tmp
        volumes:
          - name: tmp
            emptyDir: {}
