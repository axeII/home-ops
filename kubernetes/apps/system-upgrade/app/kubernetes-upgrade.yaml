---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.2
  maintenance:
    windows:
      - start: "0 2 * * 0"
        duration: "4h"
        timezone: "Europe/Paris"
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
      description: Ceph healthy apart from noout and muted AUTH_INSECURE
      # Same check as the TalosUpgrade, so a noout left over from a Talos run
      # doesn't block a Kubernetes upgrade.
      expr: >-
        status.ceph.health == "HEALTH_OK" ||
        (status.ceph.health == "HEALTH_WARN" &&
        status.ceph.details.all(k, k == "OSDMAP_FLAGS" || k.startsWith("AUTH_INSECURE")))
