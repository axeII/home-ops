---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyplex-watched
spec:
  refreshInterval: 4h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: jellyplex-watched-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Keys are the server names in resources/config.yaml.
        JPW_SERVER_TOKENS: '{"plex":"{{ .PLEX_TOKEN }}","jellyfin":"{{ .JELLYFIN_API_KEY }}"}'
  dataFrom:
    - extract:
        key: jellyplex-watched
