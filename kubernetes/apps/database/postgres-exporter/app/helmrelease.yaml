---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app postgres-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      postgres-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/prometheuscommunity/postgres-exporter
              tag: v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
            env:
              # Postgres itself runs outside the cluster.
              DATA_SOURCE_URI: db.internal:5432/postgres?sslmode=disable
            envFrom:
              - secretRef:
                  name: postgres-exporter-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    service:
      app:
        ports:
          http:
            port: 9187
    serviceMonitor:
      app:
        endpoints:
          - port: http
            interval: 1m
            scrapeTimeout: 30s
            relabelings:
              # Name the database host, not the exporter pod.
              - targetLabel: instance
                replacement: db.internal
              # Grafana dashboard 9628 builds its variables from these two labels.
              - sourceLabels: [__meta_kubernetes_namespace]
                targetLabel: kubernetes_namespace
              - targetLabel: release
                replacement: *app
