---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "juno-moe-production"
spec:
  secretName: "juno-moe-production-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "juno.moe"
  dnsNames: ["juno.moe", "*.juno.moe"]
