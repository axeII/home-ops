---
# Reads Ceph credentials directly from the rook-ceph namespace, so consumers in
# other namespaces mirror the live values instead of keeping their own copy.
#
# This exists because a hand-maintained SOPS copy of client.admin in
# system-upgrade silently went stale and broke every Talos upgrade hook. A
# mirror of the source of truth cannot drift.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kubernetes-rook-ceph
spec:
  provider:
    kubernetes:
      remoteNamespace: rook-ceph
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: rook-ceph
      auth:
        serviceAccount:
          name: eso-rook-ceph-reader
          namespace: rook-ceph
