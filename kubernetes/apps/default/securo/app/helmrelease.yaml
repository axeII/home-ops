---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app securo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      securo:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Workers must never race the schema, so the pod waits here until it is at head.
          # The loop also covers Postgres still starting on a fresh install.
          migrate:
            image: &backendImage
              repository: ghcr.io/securo-finance/securo-backend
              tag: 0.18.0@sha256:9f050a7ac5dabfe6c53b89a08a5bd4c1cf5758e057c19359bda59e7cc74e212e
            command:
              - sh
              - -c
              - |
                for i in $(seq 1 30); do
                  alembic upgrade head && exit 0
                  echo "Migration failed, retrying in 5s"
                  sleep 5
                done
                exit 1
            env: &backendEnv
              TZ: Europe/Paris
              HOME: /tmp
              FRONTEND_URL: https://finance.juno.moe
              REDIS_URL: redis://127.0.0.1:6379/0
              STORAGE_LOCAL_PATH: /app/data/attachments
              # Gateway, then the nginx frontend container.
              TRUSTED_PROXY_HOPS: "2"
              # No bank connection: transactions come in through file import only.
              SIMPLEFIN_ENABLED: "false"
              TESOURO_DIRETO_ENABLED: "false"
            envFrom: &envFrom
              - secretRef:
                  name: securo-secret
        containers:
          app:
            image: *backendImage
            command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
            env: *backendEnv
            envFrom: *envFrom
            probes:
              liveness: &backendProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8000
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *backendProbe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8000
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
          worker:
            image: *backendImage
            command: [celery, -A, app.worker, worker, --loglevel=info, --concurrency=2]
            env: *backendEnv
            envFrom: *envFrom
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
          beat:
            image: *backendImage
            # /app is not writable as uid 1000, so the schedule file goes to /tmp.
            command: [celery, -A, app.worker, beat, --loglevel=info, --schedule=/tmp/celerybeat-schedule]
            env: *backendEnv
            envFrom: *envFrom
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                memory: 512Mi
          frontend:
            image:
              repository: ghcr.io/securo-finance/securo-frontend
              tag: 0.18.0@sha256:6a0d726085cf6b67898c3dbb2b53e7949dfeeb8479ec8d45046a5cc0169ead01
            env:
              TZ: Europe/Paris
              # An IP on purpose: nginx resolves this at request time through cluster DNS,
              # which does not know "localhost".
              BACKEND_URL: http://127.0.0.1:8000
              FRONTEND_URL: https://finance.juno.moe
            probes:
              liveness: &frontendProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *frontendProbe
            securityContext:
              # nginx-unprivileged can only render its config template as its own user.
              runAsUser: 101
              runAsGroup: 101
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
          # Own Redis rather than the shared Dragonfly: Celery's default queue is the key
          # "celery", which Paperless already uses there, and Dragonfly runs in emulated
          # cluster mode so a separate DB index is not available. Nothing here needs to persist.
          redis:
            image:
              repository: docker.io/library/redis
              tag: 8.8.4-alpine@sha256:1273af45b299d2b8b60d0e400d90aa6c2c5b1794f01d6a7ca60ff3ba6e65efb5
            args: [--save, "", --appendonly, "no", --maxmemory, 96mb, --maxmemory-policy, noeviction]
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
      # Own Postgres rather than db.internal: the migrations require pgvector, which the
      # shared server does not ship.
      postgres:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Shares the RWO volume with the securo controller.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/controller
                        operator: In
                        values:
                          - securo
                  topologyKey: kubernetes.io/hostname
        containers:
          app:
            image:
              repository: docker.io/pgvector/pgvector
              tag: 0.8.7-pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
            env:
              TZ: Europe/Paris
              POSTGRES_USER: securo
              POSTGRES_DB: securo
              PGDATA: /var/lib/postgresql/data/pgdata
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: securo-secret
                    key: POSTGRES_PASSWORD
            probes:
              liveness: &postgresProbe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [pg_isready, -U, securo, -d, securo]
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *postgresProbe
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: securo
        ports:
          http:
            port: *port
      postgres:
        controller: postgres
        ports:
          postgres:
            port: 5432
    route:
      app:
        annotations:
          glance/name: Finance
          glance/show: "true"
          glance/icon: https://raw.githubusercontent.com/securo-finance/securo/main/favicons/android-icon-192x192.png
          glance/description: "Personal finance manager."
        hostnames:
          - finance.juno.moe
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          securo:
            app: &attachments
              - path: /app/data/attachments
                subPath: attachments
            worker: *attachments
            beat: *attachments
          postgres:
            app:
              - path: /var/lib/postgresql/data
                subPath: postgres
