---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: securo
spec:
  refreshInterval: 4h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: securo-secret
    template:
      data:
        SECRET_KEY: "{{ .SECURO_SECRET_KEY }}"
        # The password goes into a URL unescaped, so keep it alphanumeric.
        DATABASE_URL: "postgresql+asyncpg://securo:{{ .SECURO_POSTGRES_PASS }}@securo-postgres.default.svc.cluster.local:5432/securo"
        POSTGRES_PASSWORD: "{{ .SECURO_POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: securo
