---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: securo
spec:
  refreshInterval: 4h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: securo-secret
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .SECURO_SECRET_KEY }}"
        # The password goes into a URL unescaped, so keep it alphanumeric.
        DATABASE_URL: "postgresql+asyncpg://securo:{{ .SECURO_POSTGRES_PASS }}@db.internal:5432/securo"

        # Postgres Init
        INIT_POSTGRES_DBNAME: securo
        INIT_POSTGRES_HOST: db.internal
        INIT_POSTGRES_USER: securo
        INIT_POSTGRES_PASS: "{{ .SECURO_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: securo
    - extract:
        key: cloudnative-pg
