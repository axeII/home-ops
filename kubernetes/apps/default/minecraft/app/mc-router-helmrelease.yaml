---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mc-router
spec:
  chartRef:
    kind: OCIRepository
    name: mc-router
  interval: 1h
  # Flux reverts manual edits here, including a scale to 0. To take Minecraft
  # offline, disable the port-forward on the router or set replicaCount: 0.
  driftDetection:
    mode: enabled
  values:
    image:
      repository: itzg/mc-router
      tag: 1.56.5
      pullPolicy: IfNotPresent
    minecraftRouter:
      autoScale:
        up:
          enabled: true
        down:
          enabled: true
          after: "30m"
    extraEnv:
      # Watch only this namespace, so the Role in mc-router-rbac.yaml is enough.
      # A literal, because chart 1.5.0 renders a valueFrom map one level too
      # shallow and the fieldRef ends up outside it.
      KUBE_NAMESPACE: default
    resources:
      limits:
        memory: 64Mi
      requests:
        cpu: 5m
        memory: 16Mi
    services:
      minecraft:
        type: LoadBalancer
        port: 25565
        annotations:
          lbipam.cilium.io/ips: "192.168.69.102"
  # The chart always creates a ClusterRole that can update every StatefulSet in
  # the cluster, enough to swap the pod template of any of them.
  # mc-router-rbac.yaml replaces it with a Role for this namespace.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ClusterRole
              name: mc-router
            patch: |
              $patch: delete
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: mc-router
          - target:
              kind: ClusterRoleBinding
              name: mc-router
            patch: |
              $patch: delete
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: mc-router
