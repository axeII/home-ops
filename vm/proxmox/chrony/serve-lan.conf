# Installed on pve as /etc/chrony/conf.d/serve-lan.conf by ../deploy.sh.
# chrony is a client only by default. This lets the cluster subnet query it, so
# the Talos nodes get time over the LAN instead of single SNTP samples across
# the WAN (see talos/patches/global/machine-time.yaml).
allow 192.168.69.0/24
