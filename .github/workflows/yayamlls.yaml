---
name: Yayamlls

on:
  pull_request:
    branches: ["main"]
    # Beyond the manifests, anything that governs how yayamlls behaves must
    # re-run this gate: mise.toml pins the binary, and the config and schemas
    # decide what it accepts. None of those change a manifest, so without
    # listing them here a bump or a rule change would skip validation entirely.
    paths:
      - "kubernetes/**"
      - "mise.toml"
      - ".yayamlls.yaml"
      - ".yayamlls-schemas/**"
      - ".github/workflows/yayamlls.yaml"

jobs:
  validate:
    name: Yayamlls - Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          # Only this job's tool — mise.toml also pins the workstation set.
          install_args: "github:home-operations/yayamlls"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate manifests
        run: yayamlls validate kubernetes/
