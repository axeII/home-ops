---
name: Yayamlls

on:
  pull_request:
    branches: ["main"]
    # mise.toml pins yayamlls itself, so a version bump must re-run this gate —
    # it changes no manifest and would otherwise skip validation entirely.
    paths: ["kubernetes/**", "mise.toml", ".github/workflows/yayamlls.yaml"]

jobs:
  validate:
    name: Yayamlls - Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Only this job's tool — mise.toml also pins the workstation set.
          install_args: "github:home-operations/yayamlls"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate manifests
        run: yayamlls validate kubernetes/
