---
name: Pluto

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:

jobs:
  yaml:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Pluto
        uses: FairwindsOps/pluto/github-action@436c77cea5a73e95a1a1d8a64e5177f0b3942fc0 # master

      - name: Use pluto
        run: |
          pluto detect-files -d ./kubernetes
