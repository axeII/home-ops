---
name: Pluto

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:

jobs:
  yaml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Pluto
        uses: FairwindsOps/pluto/github-action@54e8bc77632e0be5d6b3ad6cd3f32c7460eea9c9 # master

      - name: Use pluto
        run: |
          pluto detect-files -d ./kubernetes
