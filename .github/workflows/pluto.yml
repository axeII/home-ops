---
name: Pluto

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:

jobs:
  yaml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Pluto
        uses: FairwindsOps/pluto/github-action@5de34fb0f529db53efc9ef3903150313d28493b9 # master

      - name: Use pluto
        run: |
          pluto detect-files -d ./kubernetes
